<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slide-Out Navigation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <div class="logo">Sandeep</div>
        <button class="nav-toggle" id="js-nav-toggle" aria-label="Toggle navigation">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
        </button>
    </header>

    <nav class="side-nav" id="js-side-nav">
        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About Us</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Portfolio</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>

    <main class="main-content" id="js-main-content">
        <h1>Welcome to the Site</h1>
        <p>This is a demo of a slide-out navigation menu using HTML, CSS, and JavaScript. Click the hamburger button in the top-right corner to toggle the navigation menu.</p>
    </main>

    <script src="page.js"></script>
</body>
</html>
